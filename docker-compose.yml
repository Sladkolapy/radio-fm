services:
  backend:
    build: ./backend
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    environment:
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      NODE_ENV: development

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    environment:
      VITE_DEV_API_TARGET: http://backend:3000
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules:
